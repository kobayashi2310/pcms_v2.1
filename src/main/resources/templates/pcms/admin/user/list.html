<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <title>ユーザー管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">ユーザー管理 (学生一覧)</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
        <div class="d-flex me-3">
                <input type="number" id="admissionYear" name="year" class="form-control" placeholder="年度" th:value="${selectedYear}" style="width: 120px;">
            </div>
            <a th:href="@{/pcms/admin/users/create}" class="btn btn-primary">
                <i class="bi bi-person-plus-fill"></i> 学生一括登録
            </a>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th scope="col">学生ID</th>
                <th scope="col">氏名</th>
                <th scope="col">フリガナ</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script th:src="@{/js/admin-user-list.js}"></script>
</div>
</body>
</html>
