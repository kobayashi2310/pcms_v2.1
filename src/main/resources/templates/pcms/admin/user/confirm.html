<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <title>学生一括登録（確認）</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">学生一括登録（確認）</h1>
    </div>

    <div class="alert alert-info">
        以下の内容で登録します。よろしければ「登録する」ボタンを押してください。<br>
        <small class="text-muted">※全角スペースは半角スペースに変換されています。</small>
    </div>

    <div class="mb-4">
        <h4>対象年度: <span th:text="${bulkStudentRegistrationDto.admissionYear}">2025</span></h4>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th>学籍番号 (自動採番)</th>
            <th>氏名</th>
            <th>フリガナ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student, iterStat : ${preview.validStudents}">
            <td th:text="${iterStat.count}">1</td>
            <td th:text="${student.studentId}" class="fw-bold">T25001</td>
            <td th:text="${student.name}">山田 太郎</td>
            <td th:text="${student.kana}">ヤマダ タロウ</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/pcms/admin/users/create}" method="post" th:object="${bulkStudentRegistrationDto}">
        <input type="hidden" th:field="*{admissionYear}">
        <input type="hidden" th:field="*{studentListRaw}">
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-check-circle me-2"></i>登録する
            </button>
            <button type="button" class="btn btn-secondary btn-lg" onclick="history.back()">
                <i class="bi bi-arrow-left me-2"></i>修正する
            </button>
        </div>
    </form>
</div>
</body>
</html>
